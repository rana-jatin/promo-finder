# Overlay for the hosted demo (server.py), merged onto config.yaml. Only what differs is here.
# Goal: a 3-5 episode run in a few minutes on free-tier keys, so fast models only. Lists replace, dicts merge.
llm:
  routes:
    context:
      stages: [bible, link]
      models:
        - name: gemini/gemini-flash-lite-latest  # ~8 s per call measured 2026-11-20
          rpm: 15
          timeout_s: 120
          extra: &gemini_safety
            safety_settings:
              - {category: HARM_CATEGORY_HARASSMENT, threshold: BLOCK_NONE}
              - {category: HARM_CATEGORY_HATE_SPEECH, threshold: BLOCK_NONE}
              - {category: HARM_CATEGORY_DANGEROUS_CONTENT, threshold: BLOCK_NONE}
              - {category: HARM_CATEGORY_SEXUALLY_EXPLICIT, threshold: BLOCK_NONE}
        - name: groq/openai/gpt-oss-120b   # fallback; 8k tokens/min on the free tier
          rpm: 2
          timeout_s: 120
    mine:
      stages: [mine]
      models:
        - name: gemini/gemini-flash-lite-latest
          rpm: 15
          timeout_s: 120
          extra: *gemini_safety
        - name: groq/openai/gpt-oss-120b   # fallback; 8k tokens/min on the free tier
          rpm: 2
          timeout_s: 120
    judge:
      stages: [judge, duel]
      models:
        # Flash-Lite first: Groq's free tier allows only 8k tokens/min, and one judge call is ~2.5-3k tokens,
        # so Groq as the primary was rate-limited on every call (measured 2026-11-20). It stays as the fallback.
        - name: gemini/gemini-flash-lite-latest
          rpm: 15
          timeout_s: 90
          extra: *gemini_safety
        - name: groq/openai/gpt-oss-120b
          rpm: 3
          timeout_s: 90
  max_retries: 3

run:
  max_concurrency: 4
  fast_episodes: 5
  fast_judge: 15
