# Overlay for the hosted demo (server.py), merged onto config.yaml. Only what differs is here.
# The models are NOT overridden: the demo runs the same llm.routes, prompts, rules and scoring as the CLI.
# What changes is only the run size, because uploads are capped at 6 episodes. Lists replace, dicts merge.

run:
  max_concurrency: 4
  fast_episodes: 5
  fast_judge: 15

select:
  # the demo runs 3-6 episodes: a top 10 would swallow every eligible promo and leave no reserve, so the
  # editor's reject -> backfill step would have nothing to promote. Top 5 + reserve, 3 per episode.
  shortlist: 5
  reserve: 5
  max_per_episode: 3
